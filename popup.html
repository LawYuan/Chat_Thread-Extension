<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* 全局优雅抗锯齿排版 */
    body { 
      width: 350px; 
      padding: 20px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: #ffffff; 
      color: #333; 
      margin: 0; 
      -webkit-font-smoothing: antialiased;
    }
    h2 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; color: #1a1a1a; }
    p.sub-title { margin: 0 0 20px 0; font-size: 12px; color: #666; line-height: 1.5; }

    /* 高级感：卡片式引擎选择器 */
    .engine-selector { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .engine-card {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px;
      border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer;
      transition: all 0.2s ease; background: #fafafa;
    }
    .engine-card:hover { border-color: #b3cdef; background: #fdfefe; }
    
    .engine-card input[type="radio"] {
      appearance: none; width: 16px; height: 16px; border: 2px solid #ccc; border-radius: 50%;
      margin: 2px 0 0 0; outline: none; position: relative; cursor: pointer; flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .engine-card input[type="radio"]:checked { border-color: #0b57d0; background: #0b57d0; }
    .engine-card input[type="radio"]:checked::after {
      content: ''; position: absolute; top: 4px; left: 4px; width: 4px; height: 4px;
      background: white; border-radius: 50%;
    }
    .engine-card:has(input:checked) { border-color: #0b57d0; background: #f4f7fc; }
    
    .card-info { display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 13px; font-weight: 600; color: #222; }
    .card-desc { font-size: 11px; color: #666; line-height: 1.4; }

    /* 密钥输入区及操作按钮 */
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .label { font-size: 13px; font-weight: 600; color: #222; }
    
    /* 🚀 新版行动按钮样式 */
    .action-link { 
      font-size: 11px; font-weight: 600; color: #444; text-decoration: none; 
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; 
      border: 1px solid #ddd; border-radius: 6px; background: #fff;
      transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .action-link:hover { border-color: #0b57d0; color: #0b57d0; background: #f8fbff; box-shadow: 0 2px 6px rgba(11,87,208,0.1); }

    .input-wrapper { 
      display: flex; align-items: center; border: 1px solid #d1d5db; 
      border-radius: 8px; padding: 4px 10px; background: #fff; margin-bottom: 6px; transition: border-color 0.2s; 
    }
    .input-wrapper:focus-within { border-color: #0b57d0; box-shadow: 0 0 0 2px rgba(11,87,208,0.1); }
    input[type="password"], input[type="text"] { 
      flex: 1; border: none; padding: 8px 0; 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
      font-size: 12px; outline: none; color: #333; background: transparent;
    }
    input::placeholder { color: #aaa; font-family: sans-serif;}
    .toggle-vis { background: none; border: none; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px; }
    .toggle-vis:hover { color: #333; background: #f0f0f0; }

    /* 💡 新版微文案与悬停图片框 */
    .micro-guide { font-size: 11px; color: #777; line-height: 1.5; margin-bottom: 20px; padding-left: 2px; }
    .tooltip-trigger { 
      color: #0b57d0; cursor: pointer; position: relative; display: inline-block; 
      border-bottom: 1px dashed #0b57d0; margin-left: 4px; font-weight: 600;
    }
    .tooltip-img-box {
      position: absolute; bottom: 130%; left: 50%; transform: translateX(-20%);
      width: 300px; background: #fff; padding: 6px; border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #eee;
      visibility: hidden; opacity: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100; pointer-events: none;
    }
    .tooltip-img-box::after {
      content: ''; position: absolute; top: 100%; left: 20%; transform: translateX(-50%);
      border-width: 6px; border-style: solid; border-color: #fff transparent transparent transparent;
    }
    .tooltip-img-box img { width: 100%; height: auto; border-radius: 4px; display: block; border: 1px solid #f0f0f0; }
    .tooltip-trigger:hover .tooltip-img-box { visibility: visible; opacity: 1; bottom: 150%; }

    button#btn-save { 
      width: 100%; padding: 12px; background: #0b57d0; color: white; 
      border: none; border-radius: 8px; cursor: pointer; font-size: 14px; 
      font-weight: 600; transition: background 0.2s, transform 0.1s; 
    }
    button#btn-save:hover { background: #0842a0; }
    button#btn-save:active { transform: scale(0.98); }
    button#btn-save:disabled { background: #ccc; color: #fff; cursor: not-allowed; box-shadow: none; transform: none; }
    
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; vertical-align: top; display: inline-block; }
    .badge-green { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
    .badge-orange { background: #fce8e6; color: #d93025; border: 1px solid #fad2cf; }

    #status { 
      margin-top: 14px; display: none; align-items: center; justify-content: center; gap: 6px; 
      color: #0f9d58; font-size: 13px; font-weight: 500; animation: fadeIn 0.3s ease; 
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <h2 id="ui-title"></h2>
  <p class="sub-title" id="ui-subtitle"></p>

  <div class="engine-selector" id="engine-selector">
    <label class="engine-card" id="card-zhipu">
      <input type="radio" name="engine" value="zhipu">
      <div class="card-info">
        <span class="card-title" id="zhipu-title"></span>
        <span class="card-desc" id="zhipu-desc"></span>
      </div>
    </label>
    <label class="engine-card" id="card-gemini">
      <input type="radio" name="engine" value="gemini">
      <div class="card-info">
        <span class="card-title" id="gemini-title"></span>
        <span class="card-desc" id="gemini-desc"></span>
      </div>
    </label>
  </div>

  <div id="zhipu-group" class="key-group">
    <div class="label-row">
      <span class="label" id="zhipu-label"></span>
      <a class="action-link" href="https://open.bigmodel.cn/usercenter/apikeys" target="_blank" id="zhipu-link"></a>
    </div>
    <div class="input-wrapper">
      <input type="password" id="zhipu-key">
      <button class="toggle-vis" data-target="zhipu-key">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      </button>
    </div>
    <div class="micro-guide">
      💡 <span id="zhipu-guide-text"></span>
      <span class="tooltip-trigger" id="zhipu-view-img">
        <div class="tooltip-img-box"><img src="zhipu-guide.png" alt="图示"></div>
      </span>
    </div>
  </div>

  <div id="gemini-group" class="key-group" style="display: none;">
    <div class="label-row">
      <span class="label" id="gemini-label"></span>
      <a class="action-link" href="https://aistudio.google.com/app/apikey" target="_blank" id="gemini-link"></a>
    </div>
    <div class="input-wrapper">
      <input type="password" id="gemini-key">
      <button class="toggle-vis" data-target="gemini-key">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      </button>
    </div>
    <div class="micro-guide">
      💡 <span id="gemini-guide-text"></span>
    </div>
  </div>

  <div id="privacy-notice" style="font-size: 11px; color: #666; text-align: left; margin-bottom: 12px; line-height: 1.4; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px solid #eee;">
    <span id="privacy-text"></span>
  </div>

  <button id="btn-save">请先选择一个 AI 引擎</button>
  <div id="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="status-text"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
